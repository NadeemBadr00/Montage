<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقسم ملفات الترجمة (SRT Splitter)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
        .drag-active {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold mb-2">مقسم ملفات الترجمة الذكي 🎬</h1>
            <p class="text-indigo-100 text-sm">يقسم كل جملة طويلة إلى مقاطع صغيرة (مع الحفاظ على التوقيت الخاص بكل جملة)</p>
        </div>

        <div class="p-8 space-y-6">
            
            <!-- Settings -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">أقصى عدد كلمات في السطر</label>
                    <input type="number" id="wordLimit" value="3" min="1" max="10" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">اسم الملف الجديد</label>
                    <input type="text" id="outputFileName" value="split_subtitle" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
            </div>

            <!-- Upload Area -->
            <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer transition-all duration-300 hover:border-indigo-400 group">
                <input type="file" id="fileInput" accept=".srt" class="hidden">
                <div class="space-y-3 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400 group-hover:text-indigo-500 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p class="text-gray-600 font-medium">اضغط لرفع ملف SRT أو اسحبه هنا</p>
                    <p class="text-xs text-gray-400" id="fileNameDisplay">لم يتم اختيار ملف</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <button id="processBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3 px-6 rounded-lg transition duration-300 shadow-md transform hover:-translate-y-1">
                بدء التقسيم والمعالجة ⚙️
            </button>

            <!-- Results Area -->
            <div id="resultArea" class="hidden space-y-4 animate-fade-in">
                <div class="bg-green-50 border border-green-200 rounded-lg p-4 flex items-center justify-between">
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span class="text-green-700 font-medium">تمت العملية بنجاح!</span>
                    </div>
                    <span id="statsDisplay" class="text-sm text-green-600 font-bold"></span>
                </div>

                <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 shadow-md flex items-center justify-center space-x-2 space-x-reverse">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>تحميل الملف الجديد (.srt)</span>
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- Elements ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultArea = document.getElementById('resultArea');
        const wordLimitInput = document.getElementById('wordLimit');
        const outputFileNameInput = document.getElementById('outputFileName');
        const statsDisplay = document.getElementById('statsDisplay');

        let originalContent = null;
        let generatedContent = null;

        // --- Event Listeners ---
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });
        processBtn.addEventListener('click', processSRT);
        downloadBtn.addEventListener('click', downloadSRT);

        // --- Functions ---

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (file) {
                fileNameDisplay.textContent = `الملف المختار: ${file.name}`;
                const reader = new FileReader();
                reader.onload = (e) => {
                    originalContent = e.target.result;
                    processBtn.disabled = false;
                    resultArea.classList.add('hidden');
                };
                reader.readAsText(file);
            }
        }

        function timeToMs(timeStr) {
            if (!timeStr) return 0;
            const [time, ms] = timeStr.trim().split(',');
            const [hours, minutes, seconds] = time.split(':').map(Number);
            return (hours * 3600000) + (minutes * 60000) + (seconds * 1000) + parseInt(ms || 0, 10);
        }

        function msToTime(duration) {
            let milliseconds = Math.floor((duration % 1000));
            let seconds = Math.floor((duration / 1000) % 60);
            let minutes = Math.floor((duration / (1000 * 60)) % 60);
            let hours = Math.floor((duration / (1000 * 60 * 60)) % 24);

            hours = (hours < 10) ? "0" + hours : hours;
            minutes = (minutes < 10) ? "0" + minutes : minutes;
            seconds = (seconds < 10) ? "0" + seconds : seconds;
            milliseconds = milliseconds.toString().padStart(3, '0');

            return `${hours}:${minutes}:${seconds},${milliseconds}`;
        }

        function processSRT() {
            if (!originalContent) return;

            const limit = parseInt(wordLimitInput.value) || 3;
            
            // 1. Normalize line endings to avoid parsing errors
            // This converts Windows/Mac line endings to standard \n
            const content = originalContent.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            
            // 2. Split into blocks based on double newlines
            // This ensures we treat each subtitle block separately
            const blocks = content.trim().split(/\n\n+/);
            
            let newBlocks = [];
            let globalCounter = 1;

            blocks.forEach(block => {
                const lines = block.split('\n');
                
                // Need at least timestamp and text
                if (lines.length < 2) return; 

                // Find the timestamp line safely
                let timeLineIndex = lines.findIndex(l => l.includes('-->'));
                if (timeLineIndex === -1) return;

                const timeLine = lines[timeLineIndex];
                
                // Get all text lines after the timestamp and join them
                // This handles multi-line text within a single block
                const textLines = lines.slice(timeLineIndex + 1).filter(l => l.trim() !== '');
                if (textLines.length === 0) return;

                const fullText = textLines.join(' ').trim();
                
                // Split text into words (handling multiple spaces)
                const words = fullText.split(/\s+/);
                
                const [startStr, endStr] = timeLine.split(' --> ');
                const startTime = timeToMs(startStr);
                const endTime = timeToMs(endStr);
                const totalDuration = endTime - startTime;

                // --- LOGIC: ISOLATED BLOCK PROCESSING ---
                
                // Case 1: If words are few, keep the block as is (just update ID)
                if (words.length <= limit) {
                    newBlocks.push({
                        id: globalCounter++,
                        start: startStr,
                        end: endStr,
                        text: fullText
                    });
                    return; // Done with this block, move to next
                }

                // Case 2: Split ONLY this block's text and distribute ONLY this block's duration
                let chunks = [];
                for (let i = 0; i < words.length; i += limit) {
                    chunks.push(words.slice(i, i + limit).join(' '));
                }

                // Calculate duration per chunk based on THIS block's total duration
                const durationPerChunk = totalDuration / chunks.length;
                let currentStart = startTime;

                chunks.forEach(chunkText => {
                    let chunkEnd = currentStart + durationPerChunk;
                    
                    newBlocks.push({
                        id: globalCounter++,
                        start: msToTime(currentStart),
                        end: msToTime(chunkEnd),
                        text: chunkText
                    });

                    currentStart = chunkEnd;
                });
            });

            // Build new SRT string
            generatedContent = newBlocks.map(b => {
                return `${b.id}\n${b.start} --> ${b.end}\n${b.text}\n`;
            }).join('\n');

            // UI Feedback
            statsDisplay.textContent = `تم معالجة ${blocks.length} جملة وتحويلها إلى ${newBlocks.length} مقطع`;
            resultArea.classList.remove('hidden');
        }

        function downloadSRT() {
            if (!generatedContent) return;

            const blob = new Blob([generatedContent], { type: 'text/plain;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            let filename = outputFileNameInput.value || 'split_subtitle';
            if (!filename.endsWith('.srt')) filename += '.srt';

            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
