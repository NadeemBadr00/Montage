<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة WebCodecs (بالصوت والصورة)</title>
    <!-- مكتبة الأيقونات لشبكات التواصل -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة لإنشاء ملف MP4 محلياً وفك تشفيره -->
    <script src="https://unpkg.com/mp4-muxer/build/mp4-muxer.js"></script>
    <script src="https://unpkg.com/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"></script>
    <script>
        function forceHex(value) {
            if (!value || value === 'transparent') return '#000000';
            if (value.startsWith('#')) return value;
            return '#000000';
        }

        window.drawAdvancedText = function(ctx, clip, w, h, timeInSeconds, ratioX=1, ratioY=1, scaleRatio=1) {
            const style = clip.textStyle || {};
            let text = clip.src || clip.text || "Text";
            
            if (style.textTransform === 'uppercase') text = text.toUpperCase();
            else if (style.textTransform === 'lowercase') text = text.toLowerCase();
            else if (style.textTransform === 'capitalize') text = text.replace(/\b\w/g, c => c.toUpperCase());

            const centerX = w / 2; const centerY = h / 2;
            const posX = ((clip.properties && clip.properties.positionX) ? clip.properties.positionX : 0) * ratioX;
            const posY = ((clip.properties && clip.properties.positionY) ? clip.properties.positionY : 0) * ratioY;
            const rot = (clip.properties && clip.properties.rotation) ? clip.properties.rotation : 0;
            // DO NOT apply scaleRatio here, because fontSize is based on h which is already scaled!
            const scale = (clip.properties && clip.properties.scale !== undefined) ? (clip.properties.scale / 100) : 1;
            const scaleX = (clip.properties && clip.properties.scaleX !== undefined) ? (clip.properties.scaleX / 100) : 1;
            const scaleY = (clip.properties && clip.properties.scaleY !== undefined) ? (clip.properties.scaleY / 100) : 1;
            const baseOpacity = (clip.properties && clip.properties.opacity !== undefined) ? (clip.properties.opacity / 100) : 1;

            ctx.save();
            ctx.translate(centerX + posX, centerY + posY);
            
            // --- Transitions Calculation ---
            let currentScale = scale;
            let currentAlpha = baseOpacity;
            if (timeInSeconds !== undefined && clip.transitions) {
                const trans = clip.transitions;
                const localTime = timeInSeconds - clip.start;
                const totalD = clip.duration;
                const dIn = trans.duration || 0.5;
                const dOut = trans.duration || 0.5;
                
                if (localTime < dIn && trans.in && trans.in !== 'none') {
                    const p = localTime / dIn;
                    if (trans.in === 'fade') currentAlpha = baseOpacity * p;
                    else if (trans.in === 'zoomIn') { currentAlpha = baseOpacity * p; currentScale = scale * p; }
                    else if (trans.in === 'pop') { currentAlpha = baseOpacity * p; currentScale = scale * Math.max(0.01, p + Math.sin(p * Math.PI) * 0.3); }
                    else if (trans.in === 'slideUp') { currentAlpha = baseOpacity * p; ctx.translate(0, (1 - p) * 100); }
                    else if (trans.in === 'typewriter') {
                        const totalChars = text.length;
                        const visibleChars = Math.max(1, Math.floor(p * totalChars));
                        text = text.substring(0, visibleChars);
                    }
                } 
                else if (localTime > totalD - dOut && trans.out && trans.out !== 'none') {
                    const p = (totalD - localTime) / dOut;
                    if (trans.out === 'fade') currentAlpha = baseOpacity * p;
                    else if (trans.out === 'zoomOut') { currentAlpha = baseOpacity * p; currentScale = scale * p; }
                    else if (trans.out === 'pop') { currentAlpha = baseOpacity * p; currentScale = scale * Math.max(0.01, p + Math.sin((1-p) * Math.PI) * 0.3); }
                    else if (trans.out === 'slideDown') { currentAlpha = baseOpacity * p; ctx.translate(0, -(1 - p) * 100); }
                }
            }

            ctx.globalAlpha = currentAlpha;
            ctx.rotate((rot * Math.PI) / 180);
            ctx.scale(currentScale * scaleX, currentScale * scaleY);
            
            const fontSize = h * 0.05; 
            const fontStyle = style.fontStyle === 'italic' ? 'italic' : 'normal';
            ctx.font = `${fontStyle} ${style.fontWeight || 'bold'} ${fontSize}px "${style.fontFamily || 'Cairo'}", "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
            
            const align = style.textAlign || 'center';
            ctx.textAlign = align; 
            ctx.textBaseline = "middle";

            const maxWidth = w * 0.8;
            const rawLines = text.split('\\n');
            const lines = [];
            
            for (const rawLine of rawLines) {
                const words = rawLine.split(' ');
                let line = '';
                for (let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) { 
                        lines.push(line.trim()); 
                        line = words[n] + ' '; 
                    } else { 
                        line = testLine; 
                    }
                }
                lines.push(line.trim());
            }

            const lineHeight = fontSize * 1.4;
            const totalHeight = lines.length * lineHeight;
            let maxLineWidth = 0;
            lines.forEach(l => { const m = ctx.measureText(l); if(m.width > maxLineWidth) maxLineWidth = m.width; });
            
            const padding = style.padding !== undefined ? style.padding : 20;
            const boxW = maxLineWidth + (padding * 2);
            const boxH = totalHeight + (padding * 2);
            const startY = -(totalHeight / 2) + (lineHeight / 2);

            // Render Background
            const bgOpacity = (style.backgroundOpacity !== undefined ? style.backgroundOpacity : 0) / 100;
            if (bgOpacity > 0) {
                ctx.save();
                ctx.globalAlpha *= bgOpacity;
                ctx.fillStyle = forceHex(style.backgroundColor);
                ctx.fillRect(-boxW/2, -boxH/2, boxW, boxH);
                ctx.restore();
            }

            if (style.shadowBlur > 0) {
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = style.shadowBlur;
                ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            } else { ctx.shadowColor = "transparent"; }

            ctx.fillStyle = forceHex(style.color);
            ctx.strokeStyle = forceHex(style.strokeColor);
            ctx.lineWidth = style.strokeWidth || 0;

            // Calculate X origin based on alignment
            let textX = 0;
            if (align === 'left') textX = -boxW/2 + padding;
            else if (align === 'right') textX = boxW/2 - padding;

            lines.forEach((l, i) => {
                const currentY = startY + (i * lineHeight);
                const trimmed = l.trim();
                if (style.strokeWidth > 0) ctx.strokeText(trimmed, textX, currentY);
                ctx.fillText(trimmed, textX, currentY);
                
                // Render Underline
                if (style.textDecoration === 'underline') {
                    const m = ctx.measureText(trimmed);
                    const lw = m.width;
                    let lineX = textX;
                    if (align === 'center') lineX -= lw / 2;
                    else if (align === 'right') lineX -= lw;
                    
                    ctx.save();
                    ctx.beginPath();
                    const yOffset = currentY + (fontSize * 0.4);
                    ctx.moveTo(lineX, yOffset);
                    ctx.lineTo(lineX + lw, yOffset);
                    ctx.lineWidth = Math.max(1, fontSize * 0.08);
                    ctx.strokeStyle = forceHex(style.color);
                    ctx.stroke();
                    ctx.restore();
                }
            });
            ctx.restore();
        }

        window.drawImageClip = function(ctx, clip, w, h, timeInSeconds, ratioX=1, ratioY=1, scaleRatio=1, frame=null) {
            const img = window.imageCache[clip.src];
            if (!img) return;
            
            const centerX = w / 2; const centerY = h / 2;
            const posX = ((clip.properties && clip.properties.positionX) ? clip.properties.positionX : 0) * ratioX;
            const posY = ((clip.properties && clip.properties.positionY) ? clip.properties.positionY : 0) * ratioY;
            const rot = (clip.properties && clip.properties.rotation) ? clip.properties.rotation : 0;
            // DO NOT apply scaleRatio here because drawW/drawH are already scaled down
            const scale = (clip.properties && clip.properties.scale !== undefined) ? (clip.properties.scale / 100) : 1;
            const scaleX = (clip.properties && clip.properties.scaleX !== undefined) ? (clip.properties.scaleX / 100) : 1;
            const scaleY = (clip.properties && clip.properties.scaleY !== undefined) ? (clip.properties.scaleY / 100) : 1;
            const baseOpacity = (clip.properties && clip.properties.opacity !== undefined) ? (clip.properties.opacity / 100) : 1;

            ctx.save();
            ctx.translate(centerX + posX, centerY + posY);
            
            let currentScale = scale;
            let currentAlpha = baseOpacity;
            if (timeInSeconds !== undefined && clip.transitions) {
                const trans = clip.transitions;
                const localTime = timeInSeconds - clip.start;
                const totalD = clip.duration;
                const dIn = trans.duration || 0.5;
                const dOut = trans.duration || 0.5;
                
                if (localTime < dIn && trans.in && trans.in !== 'none') {
                    const p = localTime / dIn;
                    if (trans.in === 'fade') currentAlpha = baseOpacity * p;
                    else if (trans.in === 'zoomIn') { currentAlpha = baseOpacity * p; currentScale = scale * p; }
                    else if (trans.in === 'pop') { currentAlpha = baseOpacity * p; currentScale = scale * Math.max(0.01, p + Math.sin(p * Math.PI) * 0.3); }
                    else if (trans.in === 'slideUp') { currentAlpha = baseOpacity * p; ctx.translate(0, (1 - p) * 100); }
                } 
                else if (localTime > totalD - dOut && trans.out && trans.out !== 'none') {
                    const p = (totalD - localTime) / dOut;
                    if (trans.out === 'fade') currentAlpha = baseOpacity * p;
                    else if (trans.out === 'zoomOut') { currentAlpha = baseOpacity * p; currentScale = scale * p; }
                    else if (trans.out === 'pop') { currentAlpha = baseOpacity * p; currentScale = scale * Math.max(0.01, p + Math.sin((1-p) * Math.PI) * 0.3); }
                    else if (trans.out === 'slideDown') { currentAlpha = baseOpacity * p; ctx.translate(0, -(1 - p) * 100); }
                }
            }

            ctx.globalAlpha = currentAlpha;
            ctx.rotate((rot * Math.PI) / 180);
            
            // COVER mode logic matching getClipDrawRect in EditorApp
            const baseW = window.exportManifest?.baseWidth || 1280;
            const baseH = window.exportManifest?.baseHeight || 720;
            const canvasRatio = baseW / baseH;
            const imgRatio = img.width / img.height;
            
            let drawW, drawH;
            if (canvasRatio > imgRatio) {
                drawW = baseW; drawH = baseW / imgRatio;
            } else {
                drawH = baseH; drawW = baseH * imgRatio;
            }
            
            // Apply scaleRatio to the calculated COVER dimensions
            drawW *= ratioX;
            drawH *= ratioY;

            ctx.scale(currentScale * scaleX, currentScale * scaleY);
            
            // Draw inner media if this is a frame
            if (clip.src.includes('frame_') && clip.properties && clip.properties.innerMediaSrc) {
                window.drawInnerMedia(ctx, clip, drawW, drawH, frame);
            }

            // Draw the frame image
            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            
            // Draw social overlay
            if (clip.src.includes('frame_') && clip.properties && clip.properties.overlayUI && clip.properties.overlayUI !== 'none') {
                window.drawSocialOverlay(ctx, clip, drawW, drawH);
            }

            ctx.restore();
        };

        window.drawInnerMedia = function(ctx, clip, outerW, outerH, frame=null) {
            let innerImg = null;
            if (clip.properties.innerMediaType === 'image' && window.imageCache[clip.properties.innerMediaSrc]) {
                innerImg = window.imageCache[clip.properties.innerMediaSrc];
            } else if (clip.properties.innerMediaType === 'video') {
                if (frame) {
                    innerImg = frame;
                } else if (window.cachedFData && window.cachedFData.data) {
                    // For preview only - we draw the current video frame using cachedFData if available!
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = window.cachedFData.width;
                    tempCanvas.height = window.cachedFData.height;
                    tempCanvas.getContext('2d').putImageData(window.cachedFData, 0, 0);
                    innerImg = tempCanvas;
                }
            }
            if (!innerImg) return;

            let wRatio = 1, hRatio = 1;
            if (clip.src.includes('frame_phone')) { wRatio = 650/800; hRatio = 1450/1600; }
            else if (clip.src.includes('frame_real_ipad')) { wRatio = 765/840; hRatio = 559/634; }
            else if (clip.src.includes('frame_real_iphone')) { wRatio = 321/365; hRatio = 689/730; }
            else if (clip.src.includes('frame_real_laptop')) { wRatio = 731/942; hRatio = 454/766; }
            else if (clip.src.includes('frame_real_monitor')) { wRatio = 799/840; hRatio = 458/680; }
            else if (clip.src.includes('frame_real_samsung')) { wRatio = 375/427; hRatio = 812/868; }
            else if (clip.src.includes('frame_real_ui_instagram')) { wRatio = 395/462; hRatio = 850/913; }
            else if (clip.src.includes('frame_real_ui_tiktok')) { wRatio = 350/427; hRatio = 750/818; }
            else if (clip.src.includes('frame_real_ui_youtube')) { wRatio = 787/842; hRatio = 381/430; }
            else if (clip.src.includes('frame_laptop')) { wRatio = 1240/1600; hRatio = 780/1200; }
            else if (clip.src.includes('frame_monitor')) { wRatio = 1640/1920; hRatio = 880/1400; }
            else if (clip.src.includes('frame_tv')) { wRatio = 1860/2000; hRatio = 960/1200; }
            else if (clip.src.includes('frame_tablet')) { wRatio = 840/1200; hRatio = 1240/1600; }
            
            let innerScaleX = clip.properties.innerScaleX !== undefined ? parseFloat(clip.properties.innerScaleX) : 100;
            let innerScaleY = clip.properties.innerScaleY !== undefined ? parseFloat(clip.properties.innerScaleY) : 100;
            if (clip.properties.innerFitMode === 'tight') { innerScaleX *= 0.95; innerScaleY *= 0.95; }

            const holeW = outerW * wRatio;
            const holeH = outerH * hRatio;
            
            let dxFrac = 0; let dyFrac = 0;
            if (clip.src.includes('frame_real_ipad')) { dxFrac = -0.5 / 840; dyFrac = -0.5 / 634; }
            else if (clip.src.includes('frame_real_iphone')) { dxFrac = 0.0 / 365; dyFrac = -0.5 / 730; }
            else if (clip.src.includes('frame_real_laptop')) { dxFrac = -0.5 / 942; dyFrac = -114.0 / 766; }
            else if (clip.src.includes('frame_real_monitor')) { dxFrac = -0.5 / 840; dyFrac = -88.0 / 680; }
            else if (clip.src.includes('frame_real_samsung')) { dxFrac = -3.0 / 427; dyFrac = -3.0 / 868; }
            else if (clip.src.includes('frame_real_ui_instagram')) { dxFrac = -0.5 / 462; dyFrac = -1.5 / 913; }
            else if (clip.src.includes('frame_real_ui_tiktok')) { dxFrac = -5.5 / 427; dyFrac = -4.0 / 818; }
            else if (clip.src.includes('frame_real_ui_youtube')) { dxFrac = -6.5 / 842; dyFrac = 1.5 / 430; }
            
            const shiftX = dxFrac * outerW;
            const shiftY = dyFrac * outerH;

            ctx.save();
            ctx.translate(shiftX, shiftY);
            
            const left = -holeW / 2;
            const top = -holeH / 2;
            
            ctx.beginPath();
            let br = clip.properties.innerBorderRadius !== undefined ? parseFloat(clip.properties.innerBorderRadius) : (clip.src.includes('frame_real') ? 0.06 : 0.0);
            if (clip.properties.innerFitMode === 'smart') br = 0.15;
            const r = br * Math.min(holeW, holeH);
            if (ctx.roundRect && r > 0) ctx.roundRect(left, top, holeW, holeH, r);
            else ctx.rect(left, top, holeW, holeH);
            ctx.clip();
            
            ctx.fillStyle = '#000000';
            ctx.fill();
            
            let mediaW = innerImg.displayWidth || innerImg.videoWidth || innerImg.width;
            let mediaH = innerImg.displayHeight || innerImg.videoHeight || innerImg.height;
            if (!mediaW || !mediaH) { mediaW = 1920; mediaH = 1080; }
            
            const rot = clip.properties.innerRotation || 0;
            let effMediaW = mediaW;
            let effMediaH = mediaH;
            if (rot === 90 || rot === 270) {
                effMediaW = mediaH;
                effMediaH = mediaW;
            }
            
            const mediaRatio = effMediaW / effMediaH;
            const holeRatio = holeW / holeH;
            let drawMediaW, drawMediaH;
            
            if (clip.properties.innerMode === 'fill') {
                drawMediaW = holeW; drawMediaH = holeH;
            } else if (clip.properties.innerMode === 'fit') {
                if (holeRatio > mediaRatio) { drawMediaH = holeH; drawMediaW = holeH * mediaRatio; }
                else { drawMediaW = holeW; drawMediaH = holeW / mediaRatio; }
            } else { // 'crop' (default)
                if (holeRatio > mediaRatio) { drawMediaW = holeW; drawMediaH = holeW / mediaRatio; }
                else { drawMediaH = holeH; drawMediaW = holeH * mediaRatio; }
            }
            
            drawMediaW *= (innerScaleX / 100);
            drawMediaH *= (innerScaleY / 100);
            
            let renderW = drawMediaW;
            let renderH = drawMediaH;
            if (rot === 90 || rot === 270) {
                renderW = drawMediaH;
                renderH = drawMediaW;
            }
            
            const panX = ((clip.properties.innerOffsetX || 0) / 1000) * holeW;
            const panY = ((clip.properties.innerOffsetY || 0) / 1000) * holeH;
            ctx.translate(panX, panY);
            
            if (clip.properties.innerFlipX) ctx.scale(-1, 1);
            if (clip.properties.innerFlipY) ctx.scale(1, -1);
            if (rot) ctx.rotate(rot * Math.PI / 180);
            
            ctx.drawImage(innerImg, -renderW/2, -renderH/2, renderW, renderH);
            ctx.restore();
        };

        window.drawSocialOverlay = function(ctx, clip, outerW, outerH) {
            let wRatio = 1, hRatio = 1;
            if (clip.src.includes('frame_phone')) { wRatio = 650/800; hRatio = 1450/1600; }
            else if (clip.src.includes('frame_real_ipad')) { wRatio = 765/840; hRatio = 559/634; }
            else if (clip.src.includes('frame_real_iphone')) { wRatio = 321/365; hRatio = 689/730; }
            else if (clip.src.includes('frame_real_laptop')) { wRatio = 731/942; hRatio = 454/766; }
            else if (clip.src.includes('frame_real_monitor')) { wRatio = 799/840; hRatio = 458/680; }
            else if (clip.src.includes('frame_real_samsung')) { wRatio = 375/427; hRatio = 812/868; }
            else if (clip.src.includes('frame_real_ui_instagram')) { wRatio = 395/462; hRatio = 850/913; }
            else if (clip.src.includes('frame_real_ui_tiktok')) { wRatio = 350/427; hRatio = 750/818; }
            else if (clip.src.includes('frame_real_ui_youtube')) { wRatio = 787/842; hRatio = 381/430; }
            else if (clip.src.includes('frame_laptop')) { wRatio = 1240/1600; hRatio = 780/1200; }
            else if (clip.src.includes('frame_monitor')) { wRatio = 1640/1920; hRatio = 880/1400; }
            else if (clip.src.includes('frame_tv')) { wRatio = 1860/2000; hRatio = 960/1200; }
            else if (clip.src.includes('frame_tablet')) { wRatio = 840/1200; hRatio = 1240/1600; }
            
            let innerScaleX = clip.properties.innerScaleX !== undefined ? parseFloat(clip.properties.innerScaleX) : 100;
            let innerScaleY = clip.properties.innerScaleY !== undefined ? parseFloat(clip.properties.innerScaleY) : 100;
            if (clip.properties.innerFitMode === 'tight') { innerScaleX *= 0.95; innerScaleY *= 0.95; }

            const holeW = outerW * wRatio * (innerScaleX / 100);
            const holeH = outerH * hRatio * (innerScaleY / 100);
            
            let dxFrac = 0; let dyFrac = 0;
            if (clip.src.includes('frame_real_ipad')) { dxFrac = -0.5 / 840; dyFrac = -0.5 / 634; }
            else if (clip.src.includes('frame_real_iphone')) { dxFrac = 0.0 / 365; dyFrac = -0.5 / 730; }
            else if (clip.src.includes('frame_real_laptop')) { dxFrac = -0.5 / 942; dyFrac = -114.0 / 766; }
            else if (clip.src.includes('frame_real_monitor')) { dxFrac = -0.5 / 840; dyFrac = -88.0 / 680; }
            else if (clip.src.includes('frame_real_samsung')) { dxFrac = -3.0 / 427; dyFrac = -3.0 / 868; }
            else if (clip.src.includes('frame_real_ui_instagram')) { dxFrac = -0.5 / 462; dyFrac = -1.5 / 913; }
            else if (clip.src.includes('frame_real_ui_tiktok')) { dxFrac = -5.5 / 427; dyFrac = -4.0 / 818; }
            else if (clip.src.includes('frame_real_ui_youtube')) { dxFrac = -6.5 / 842; dyFrac = 1.5 / 430; }
            
            const shiftX = dxFrac * outerW;
            const shiftY = dyFrac * outerH;

            ctx.save();
            ctx.translate(shiftX, shiftY);
            
            const left = -holeW / 2;
            const right = holeW / 2;
            const top = -holeH / 2;
            const bottom = holeH / 2;
            
            // Clipping to hole
            ctx.beginPath();
            let br = clip.properties.innerBorderRadius !== undefined ? parseFloat(clip.properties.innerBorderRadius) : (clip.src.includes('frame_real') ? 0.06 : 0.0);
            if (clip.properties.innerFitMode === 'smart') br = 0.15;
            const r = br * Math.min(holeW, holeH);
            if (ctx.roundRect && r > 0) ctx.roundRect(left, top, holeW, holeH, r);
            else ctx.rect(left, top, holeW, holeH);
            ctx.clip();
            
            const uiType = clip.properties.overlayUI;
            const scaleBase = Math.min(holeW, holeH) / 400;
            
            const drawText = (text, x, y, size, align, isBold) => {
                ctx.font = `${isBold ? 'bold' : 'normal'} ${size}px "Segoe UI", sans-serif`;
                ctx.textAlign = align;
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fillText(text, x, y);
                ctx.shadowColor = 'transparent';
            };
            
            const drawIcon = (unicode, x, y, size, isBrand) => {
                ctx.font = `900 ${size}px "Font Awesome 6 Free"`; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fillText(unicode, x, y);
                ctx.shadowColor = 'transparent';
            };
            
            if (uiType === 'tiktok') {
                const iconSize = 35 * scaleBase;
                const textSize = 14 * scaleBase;
                const iconX = right - (30 * scaleBase);
                
                drawIcon('\uf2bd', iconX, bottom - (260 * scaleBase), iconSize + 5, false); // User
                drawIcon('\uf004', iconX, bottom - (190 * scaleBase), iconSize, false); // Heart
                drawText(clip.properties.uiLikes || '1.2M', iconX, bottom - (160 * scaleBase), textSize, 'center', true);
                drawIcon('\uf075', iconX, bottom - (120 * scaleBase), iconSize - 5, false); // Comment
                drawText(clip.properties.uiComments || '45K', iconX, bottom - (90 * scaleBase), textSize, 'center', true);
                drawIcon('\uf02e', iconX, bottom - (50 * scaleBase), iconSize - 5, false); // Bookmark
                drawText(clip.properties.uiShares || '12K', iconX, bottom - (20 * scaleBase), textSize, 'center', true);
                drawIcon('\uf1d8', iconX, bottom + (20 * scaleBase), iconSize - 5, false); // Share 
                
                const descX = left + (20 * scaleBase);
                drawText(clip.properties.uiUsername || '@username', descX, bottom - (50 * scaleBase), textSize + 2, 'left', true);
                drawText(clip.properties.uiDescription || 'Check out this awesome video! #viral', descX, bottom - (25 * scaleBase), textSize, 'left', false);
            }
            else if (uiType === 'instagram') {
                const iconSize = 30 * scaleBase;
                const textSize = 14 * scaleBase;
                const iconX = right - (30 * scaleBase);
                
                drawIcon('\uf004', iconX, bottom - (170 * scaleBase), iconSize, false);
                drawText(clip.properties.uiLikes || '1.2M', iconX, bottom - (145 * scaleBase), textSize, 'center', true);
                drawIcon('\uf075', iconX, bottom - (110 * scaleBase), iconSize, false);
                drawText(clip.properties.uiComments || '45K', iconX, bottom - (85 * scaleBase), textSize, 'center', true);

                drawText(clip.properties.uiUsername || '@username', descX + 40*scaleBase, bottom - (50 * scaleBase), textSize + 2, 'left', true);

            else if (uiType === 'youtube') {

                const textSize = 14 * scaleBase;
                const rightX = right - (20 * scaleBase);
                const leftX = left + (20 * scaleBase);
                
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(left, bottom - (10 * scaleBase), holeW, 4 * scaleBase);
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(left, bottom - (10 * scaleBase), holeW * 0.3, 4 * scaleBase);
                
                drawIcon('\uf04b', leftX + 10*scaleBase, bottom - (30 * scaleBase), iconSize*0.8, false); 
                
                drawIcon('\uf004', rightX - 140*scaleBase, bottom - (30 * scaleBase), iconSize, false);
                drawText(clip.properties.uiLikes || '1.2M', rightX - 110*scaleBase, bottom - (30 * scaleBase), textSize, 'left', true);
                drawIcon('\uf075', rightX - 60*scaleBase, bottom - (30 * scaleBase), iconSize, false);
                
                ctx.fillStyle = '#cc0000';
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(rightX - 250*scaleBase, bottom - (45*scaleBase), 90*scaleBase, 30*scaleBase, 15*scaleBase);
                else ctx.rect(rightX - 250*scaleBase, bottom - (45*scaleBase), 90*scaleBase, 30*scaleBase);
                ctx.fill();
                drawText('SUBSCRIBE', rightX - 205*scaleBase, bottom - (30*scaleBase), textSize*0.8, 'center', true);
                
                drawText(clip.properties.uiUsername || 'Channel Name', leftX, bottom - (70 * scaleBase), textSize + 2, 'left', true);
                drawText(clip.properties.uiDescription || '1.5M Subscribers', leftX, bottom - (50 * scaleBase), textSize, 'left', false);
            }
            
            ctx.restore();
        };
    </script>
