    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: 'AIzaSyC-fNlQQHC4Fqbx2wIBoyPOm8o43PUhJrk',
            projectId: 'ai-roadmap-nadeem',
            storageBucket: 'ai-roadmap-nadeem.firebasestorage.app',
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        function log(msg) {
            const el = document.getElementById('log');
            el.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        }

        function getQualitySettings() {
            const h = parseInt(document.getElementById('qualitySelect').value);
            let w = Math.round((h * 16) / 9);
            if (w % 2 !== 0) w -= 1; // كروت الشاشة بترفض الأرقام الفردية في أبعاد الفيديو
            
            const compressionMult = parseFloat(document.getElementById('compressionSelect').value);
            const selectedCodec = document.getElementById('codecSelect').value;
            
            let bitrate = 4_000_000; 
            if (h >= 2160) bitrate = 40_000_000;
            else if (h >= 1440) bitrate = 16_000_000;
            else if (h >= 1080) bitrate = 8_000_000;
            else if (h === 540) bitrate = 3_000_000;
            else if (h === 480) bitrate = 2_500_000;
            else if (h === 360) bitrate = 1_000_000;
            else if (h === 240) bitrate = 700_000;
            else if (h === 144) bitrate = 400_000;

            bitrate = Math.round(bitrate * compressionMult);

            let muxerCodec = 'avc';
            let encoderCodecString = 'avc1.42001f'; // H.264 Level 3.1 (720p)
            if (h >= 2160) {
                encoderCodecString = 'avc1.640033'; // H.264 High Profile Level 5.1 (4K)
            } else if (h >= 1080) {
                encoderCodecString = 'avc1.42002a'; // H.264 Baseline Level 4.2 (1080p)
            }
            
            if (selectedCodec === 'hevc') {
                muxerCodec = 'hevc';
                // HEVC Main Profile, Level 5.0 (يدعم 4K و 1080p بكفاءة)
                encoderCodecString = 'hev1.1.6.L150.90'; 
            }

            return { width: w, height: h, bitrate, muxerCodec, encoderCodecString, selectedCodec };
        }

        // =====================================================================
        // المعاينة الحية (Live Preview)
        // =====================================================================
        let cachedFData = null;
        let cachedMData = null;

        window.applyTightnessPreview = function() {
            if (!cachedFData) return;
            const pCanvas = document.getElementById('previewCanvas');
            const pCtx = pCanvas.getContext('2d');
            
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            
            if (window.exportManifest && window.exportManifest.tracks) {
                const baseW = window.exportManifest.baseWidth || 1280;
                const baseH = window.exportManifest.baseHeight || 720;
                const ratioX = pCanvas.width / baseW;
                const ratioY = pCanvas.height / baseH;
                const scaleRatio = Math.min(ratioX, ratioY);

                const vid = document.getElementById('hiddenPreviewVideo');
                const timeInSeconds = window.previewTargetTime !== undefined ? window.previewTargetTime : (vid ? vid.currentTime : 0);
                
                const origCanvas = new OffscreenCanvas(pCanvas.width, pCanvas.height);
                origCanvas.getContext('2d').putImageData(cachedFData, 0, 0);

                for (let j = window.exportManifest.tracks.length - 1; j >= 0; j--) {
                    const track = window.exportManifest.tracks[j];
                    for (const clip of track.clips) {
                        if (timeInSeconds >= clip.start && timeInSeconds < clip.start + clip.duration) {
                            
                            pCtx.save();
                            const centerX = pCanvas.width / 2; const centerY = pCanvas.height / 2;
                            const posX = (clip.properties?.positionX || 0) * ratioX;
                            const posY = (clip.properties?.positionY || 0) * ratioY;
                            const rot = clip.properties?.rotation || 0;
                            const scale = (clip.properties?.scale !== undefined ? clip.properties.scale / 100 : 1);
                            const scaleX = (clip.properties?.scaleX !== undefined ? clip.properties.scaleX / 100 : 1);
                            const scaleY = (clip.properties?.scaleY !== undefined ? clip.properties.scaleY / 100 : 1);
                            let currentAlpha = clip.properties?.opacity !== undefined ? clip.properties.opacity / 100 : 1;

                            if (clip.type === 'video' || clip.type === 'main' || clip.type === 'speaker') {
                                pCtx.translate(centerX + posX, centerY + posY);
                                pCtx.rotate((rot * Math.PI) / 180);
                                pCtx.scale(scale * scaleX, scale * scaleY);
                                pCtx.globalAlpha = currentAlpha;

                                if (clip.aiSegmentation?.enabled && cachedMData) {
                                    const tightness = parseInt(document.getElementById('aiTightness').value);
                                    const workingData = new ImageData(new Uint8ClampedArray(cachedFData.data), cachedFData.width, cachedFData.height);
                                    
                                    for(let i = 0; i < workingData.data.length; i += 4) {
                                        const mVal = cachedMData.data[i+3];
                                        if (mVal > tightness) {
                                            workingData.data[i+3] = 255; 
                                        } else {
                                            workingData.data[i] = 0; workingData.data[i+1] = 0; workingData.data[i+2] = 0; workingData.data[i+3] = 0;
                                        }
                                    }
                                    const tempCanvas = new OffscreenCanvas(pCanvas.width, pCanvas.height);
                                    tempCanvas.getContext('2d').putImageData(workingData, 0, 0);
                                    
                                    pCtx.drawImage(tempCanvas, -pCanvas.width/2, -pCanvas.height/2, pCanvas.width, pCanvas.height);
                                } else {
                                    pCtx.drawImage(origCanvas, -pCanvas.width/2, -pCanvas.height/2, pCanvas.width, pCanvas.height);
                                }
                                pCtx.restore();
                            } else if (clip.type === 'text') {
                                pCtx.restore();
                                window.drawAdvancedText(pCtx, clip, pCanvas.width, pCanvas.height, timeInSeconds, ratioX, ratioY, scaleRatio);
                            } else if (clip.type === 'image' && window.imageCache && window.imageCache[clip.src]) {
                                pCtx.restore();
                                window.drawImageClip(pCtx, clip, pCanvas.width, pCanvas.height, timeInSeconds, ratioX, ratioY, scaleRatio, origCanvas);
                            } else {
                                pCtx.restore();
                            }
                        }
                    }
                }
            }
        };

        async function initAIModelIfNeeded() {
            if (!window.segmentationModel) {
                log("🧠 جاري تحميل نموذج الذكاء الاصطناعي للمعاينة...");
                window.segmentationModel = new SelfieSegmentation({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${file}`
                });
                window.segmentationModel.setOptions({ modelSelection: 1 });
                window.segmentationModel.onResults((results) => {
                    if (window.currentMaskResolve) window.currentMaskResolve(results.segmentationMask);
                });
                await window.segmentationModel.initialize();
                log("✅ الذكاء الاصطناعي جاهز!");
            }
            
            if (!window.imageCache) {
                window.imageCache = {};
                if (window.exportManifest && window.exportManifest.tracks) {
                    for (const track of window.exportManifest.tracks) {
                        for (const clip of track.clips) {
                            if (clip.type === 'image' && clip.src && !window.imageCache[clip.src]) {
                                log(`🖼️ جاري تحميل صورة للمعاينة: ${clip.src.substring(0, 30)}...`);
                                const img = new Image();
                                img.src = clip.src;
                                await new Promise(r => { img.onload = r; img.onerror = r; });
                                window.imageCache[clip.src] = img;
                            }
                            if (clip.properties && clip.properties.innerMediaSrc && clip.properties.innerMediaType === 'image' && !window.imageCache[clip.properties.innerMediaSrc]) {
                                log(`🖼️ جاري تحميل الميديا الداخلية: ${clip.properties.innerMediaSrc.substring(0, 30)}...`);
                                const img = new Image();
                                img.src = clip.properties.innerMediaSrc;
                                await new Promise(r => { img.onload = r; img.onerror = r; });
                                window.imageCache[clip.properties.innerMediaSrc] = img;
                            }
                        }
                    }
                }
            }
        }

        async function triggerPreview(specificTime) {
            const btn = document.getElementById('previewBtn');
            const origText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "⏳ جاري استخراج فريم ومعالجته...";
            
            if (!window.bgImgLoaded) {
                window.bgImgLoaded = new Image();
                if (window.bgFile) {
                    window.bgImgLoaded.src = URL.createObjectURL(window.bgFile);
                } else {
                    window.bgImgLoaded.src = '/bg.png';
                }
                await new Promise(r => { window.bgImgLoaded.onload = r; window.bgImgLoaded.onerror = r; });
            }

            await initAIModelIfNeeded();

            const vid = document.getElementById('hiddenPreviewVideo');
            
            let maxDuration = (window.exportManifest && window.exportManifest.duration) ? window.exportManifest.duration : (vid.duration || 5);
            let targetTime = specificTime;
            
            if (targetTime === undefined) {
                targetTime = Math.random() * maxDuration;
                if (window.exportManifest && window.exportManifest.tracks) {
                    const interestingClips = [];
                    for (const track of window.exportManifest.tracks) {
                        for (const clip of track.clips) {
                            if (clip.type === 'text' || clip.type === 'image' || clip.aiSegmentation?.enabled) {
                                interestingClips.push(clip);
                            }
                        }
                    }
                    if (interestingClips.length > 0) {
                        const randomClip = interestingClips[Math.floor(Math.random() * interestingClips.length)];
                        targetTime = randomClip.start + (Math.random() * randomClip.duration);
                    }
                }
            }
            
            document.getElementById('previewTimeInput').value = targetTime.toFixed(2);
            window.previewTargetTime = targetTime;
            
            if (targetTime > vid.duration) {
                vid.currentTime = vid.duration - 0.1;
            } else {
                vid.currentTime = Math.max(0, targetTime);
            }
            
            vid.onseeked = async () => {
                const pCanvas = document.getElementById('previewCanvas');
                pCanvas.style.display = 'block';
                
                window.currentMaskResolve = (mask) => {
                    const tempCtx = new OffscreenCanvas(pCanvas.width, pCanvas.height).getContext('2d');
                    tempCtx.drawImage(vid, 0, 0, pCanvas.width, pCanvas.height);
                    cachedFData = tempCtx.getImageData(0, 0, pCanvas.width, pCanvas.height);
                    
                    const tempMaskCanvas = new OffscreenCanvas(pCanvas.width, pCanvas.height);
                    tempMaskCanvas.getContext('2d').drawImage(mask, 0, 0, pCanvas.width, pCanvas.height);
                    cachedMData = tempMaskCanvas.getContext('2d').getImageData(0, 0, pCanvas.width, pCanvas.height);
                    
                    window.applyTightnessPreview();
                    
                    document.getElementById('previewBtn').disabled = false;
                    document.getElementById('previewBtn').innerHTML = "👁️ تجربة فريم عشوائي آخر";
                    log("✅ المعاينة جاهزة.");
                };
                
                const tempCtx = new OffscreenCanvas(pCanvas.width, pCanvas.height).getContext('2d');
                tempCtx.drawImage(vid, 0, 0, pCanvas.width, pCanvas.height);
                await window.segmentationModel.send({ image: tempCtx.canvas });
            };
        }

        document.getElementById('previewBtn').addEventListener('click', () => triggerPreview());
        document.getElementById('previewTimeBtn').addEventListener('click', () => {
            const val = parseFloat(document.getElementById('previewTimeInput').value);
            if (!isNaN(val)) triggerPreview(val);
        });

        // =====================================================================
        // الكود الأول: دمج وتصدير MP4 المحلي
        // =====================================================================
        document.getElementById('startBtn').addEventListener('click', async () => {
            document.getElementById('startBtn').disabled = true;
            document.getElementById('cloudBtn').disabled = true;
            window.lastEncodedTimeUs = 0; // Reset state for multiple renders
            log("🚀 جاري بدء المعالجة المحلية الاحترافية...");

            try {
                const { width, height, bitrate, muxerCodec, encoderCodecString, selectedCodec } = getQualitySettings();
                log(`⚙️ الجودة: ${width}x${height} | البت ريت: ${bitrate/1000}kbps | كوديك: ${selectedCodec.toUpperCase()}`);
                
                // التأكد من دعم الكوديك على كارت الشاشة
                const support = await VideoEncoder.isConfigSupported({ codec: encoderCodecString, width, height, bitrate });
                if (!support.supported) {
                    throw new Error(`كارت الشاشة بتاعك مش بيدعم ضغط الفيديوهات بصيغة ${selectedCodec.toUpperCase()} على المتصفح ده.`);
                }

                const fps = 30, sampleRate = 44100, audioChannels = 2;
                const canvas = new OffscreenCanvas(width, height);
                const ctx = canvas.getContext('2d');
                
                // كانفاس مؤقت لعملية إزالة الخلفية (Chroma Key)
                const tempCanvas = new OffscreenCanvas(width, height);
                const tempCtx = tempCanvas.getContext('2d');

                let muxer = new Mp4Muxer.Muxer({
                    target: new Mp4Muxer.ArrayBufferTarget(),
                    video: { codec: muxerCodec, width, height },
                    audio: { codec: 'aac', sampleRate, numberOfChannels: audioChannels },
                    fastStart: "in-memory",
                    firstTimestampBehavior: 'offset'
                });

                let frameCount = 0;
                const videoEncoder = new VideoEncoder({
                    output: (chunk, meta) => {
                        try {
                            if (meta && meta.decoderConfig === null) {
                                delete meta.decoderConfig;
                            }
                            muxer.addVideoChunk(chunk, meta);
                        } catch (e) {
                            log("❌ خطأ Muxer: " + e.message);
                        }
                    },
                    error: e => log("❌ خطأ VideoEncoder: " + e.message)
                });
                
                videoEncoder.configure({ codec: encoderCodecString, width, height, bitrate, bitrateMode: "variable", framerate: fps, hardwareAcceleration: "prefer-hardware" });

                const audioEncoder = new AudioEncoder({
                    output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
                    error: e => log("❌ خطأ AudioEncoder: " + e.message)
                });
                audioEncoder.configure({ codec: 'mp4a.40.2', sampleRate, numberOfChannels: audioChannels, bitrate: 128_000 });

                let currentAudioTimeUs = 0;

                // استخراج مسارات الفيديو والصوت من التايم لاين عشان نطبق القص (Cuts)
                const videoClips = [];
                const audioClips = [];
                window.imageCache = {};

                if (window.exportManifest && window.exportManifest.tracks) {
                    for (const track of window.exportManifest.tracks) {
                        for (const clip of track.clips) {
                            if (clip.type === 'video') videoClips.push(clip);
                            if (clip.type === 'audio') audioClips.push(clip);
                            if (clip.type === 'image' && clip.src && !window.imageCache[clip.src]) {
                                log(`🖼️ جاري تحميل صورة: ${clip.src.substring(0, 30)}...`);
                                const img = new Image();
                                img.src = clip.src;
                                await new Promise(r => { img.onload = r; img.onerror = r; });
                                window.imageCache[clip.src] = img;
                            }
                            if (clip.properties && clip.properties.innerMediaSrc && clip.properties.innerMediaType === 'image' && !window.imageCache[clip.properties.innerMediaSrc]) {
                                log(`🖼️ جاري تحميل الميديا الداخلية للتصدير: ${clip.properties.innerMediaSrc.substring(0, 30)}...`);
                                const img = new Image();
                                img.src = clip.properties.innerMediaSrc;
                                await new Promise(r => { img.onload = r; img.onerror = r; });
                                window.imageCache[clip.properties.innerMediaSrc] = img;
                            }
                        }
                    }
                }
                // ترتيب المقاطع حسب وقت ظهورها على التايم لاين
                videoClips.sort((a, b) => a.start - b.start);
                audioClips.sort((a, b) => a.start - b.start);
                
                if (videoClips.length === 0) {
                    videoClips.push({ start: 0, duration: 999999, sourceIn: 0, type: 'video' });
                }
                if (audioClips.length === 0) {
                    audioClips.push({ start: 0, duration: 999999, sourceIn: 0, type: 'audio', src: 'file' });
                }

                // ⚡️ دالة قراءة الفيديو بالطريقة الاحترافية (MP4Box + VideoDecoder)
                async function processVideo(videoSrc, clip) {
                    return new Promise(async (resolve, reject) => {
                        try {
                            let buffer;
                            if (window.videoFile) {
                                log(`📦 تحميل الفيديو من الذاكرة المحلية (IndexedDB)...`);
                                buffer = await window.videoFile.arrayBuffer();
                            } else {
                                log(`🎬 سحب الداتا الخام لفيديو ${videoSrc}...`);
                                const response = await fetch(videoSrc);
                                buffer = await response.arrayBuffer();
                            }
                            buffer.fileStart = 0;
                            log(`📦 تم تحميل ${buffer.byteLength} بايت، جاري فك التشفير...`);

                            const mp4boxfile = MP4Box.createFile();
                            let decoder;
                            let trackDurationUs = 0;
                            
                            mp4boxfile.onError = (e) => {
                                log("❌ خطأ MP4Box: " + e);
                                reject(e);
                            };

                            mp4boxfile.onReady = (info) => {
                                try {
                                    log(`📝 الملف جاهز، جاري قراءة معلومات الـ Track...`);
                                    const track = info.videoTracks[0];
                                    if (!track) throw new Error("لا يوجد مسار فيديو!");
                                    trackDurationUs = (track.duration / track.timescale) * 1_000_000;
                                    
                                    let description;
                                    const trak = mp4boxfile.getTrackById(track.id);
                                    for (const entry of trak.mdia.minf.stbl.stsd.entries) {
                                        if (entry.avcC) {
                                            const stream = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
                                            entry.avcC.write(stream);
                                            description = stream.buffer.slice(8);
                                            break;
                                        }
                                    }

                                    let frameQueue = [];
                                    let processingAI = false;
                                    window.isQueueEmpty = true;
                                    
                                    let tmpCanvas = null;
                                    let tmpCtx = null;

                                    const processQueue = async () => {
                                        if (processingAI || frameQueue.length === 0) {
                                            if (frameQueue.length === 0 && !processingAI) window.isQueueEmpty = true;
                                            return;
                                        }
                                        processingAI = true;
                                        window.isQueueEmpty = false;
                                        
                                        const { frame, isKeyFrame, timelineTimeUs } = frameQueue.shift();

                                        const timeInSeconds = timelineTimeUs / 1_000_000;

                                        // مسح الكانفاس للفريم الجديد
                                        ctx.globalCompositeOperation = 'source-over';
                                        ctx.clearRect(0, 0, width, height);

                                        // التحقق مما إذا كان هناك مسار ذكاء اصطناعي نشط في هذا الفريم
                                        let needsAI = false;
                                        if (window.exportManifest && window.exportManifest.tracks) {
                                            for (const track of window.exportManifest.tracks) {
                                                for (const clip of track.clips) {
                                                    if (timeInSeconds >= clip.start && timeInSeconds < clip.start + clip.duration) {
                                                        if ((clip.type === 'video' || clip.type === 'main' || clip.type === 'speaker') && clip.aiSegmentation?.enabled) {
                                                            needsAI = true;
                                                        }
                                                    }
                                                }
                                            }
                                        }

                                        const baseW = window.exportManifest?.baseWidth || 1280;
                                        const baseH = window.exportManifest?.baseHeight || 720;
                                        const ratioX = width / baseW;
                                        const ratioY = height / baseH;
                                        const scaleRatio = Math.min(ratioX, ratioY);

                                        const renderAllLayers = (mask) => {
                                            let activeLayerNames = [];
                                            if (window.exportManifest && window.exportManifest.tracks) {
                                                // الترتيب من تحت لفوق (من V1 لأعلى تراك)
                                                for (let i = window.exportManifest.tracks.length - 1; i >= 0; i--) {
                                                    const track = window.exportManifest.tracks[i];
                                                    for (const clipTrack of track.clips) {
                                                        if (timeInSeconds >= clipTrack.start && timeInSeconds < clipTrack.start + clipTrack.duration) {
                                                            const layerLogName = track.trackName ? `[${track.trackName}] (${clipTrack.type.toUpperCase()})` : clipTrack.type.toUpperCase();
                                                            
                                                            const posX = clipTrack.properties?.positionX || 0;
                                                            const posY = clipTrack.properties?.positionY || 0;
                                                            const rot = clipTrack.properties?.rotation || 0;
                                                            const scale = (clipTrack.properties?.scale !== undefined ? clipTrack.properties.scale / 100 : 1);
                                                            const scaleX = (clipTrack.properties?.scaleX !== undefined ? clipTrack.properties.scaleX / 100 : 1);
                                                            const scaleY = (clipTrack.properties?.scaleY !== undefined ? clipTrack.properties.scaleY / 100 : 1);
                                                            let currentAlpha = clipTrack.properties?.opacity !== undefined ? clipTrack.properties.opacity / 100 : 1;

                                                            // حساب التأثيرات الديناميكية لتسجيلها في اللوج
                                                            let dynScale = scale * scaleX;
                                                            if (clipTrack.transitions) {
                                                                const trans = clipTrack.transitions;
                                                                const localTime = timeInSeconds - clipTrack.start;
                                                                const totalD = clipTrack.duration;
                                                                const dIn = trans.duration || 0.5;
                                                                const dOut = trans.duration || 0.5;
                                                                if (localTime < dIn && trans.in === 'pop') dynScale = scale * Math.max(0.01, (localTime/dIn) + Math.sin((localTime/dIn)*Math.PI)*0.3);
                                                                else if (localTime > totalD - dOut && trans.out === 'pop') { const p = (totalD-localTime)/dOut; dynScale = scale * Math.max(0.01, p + Math.sin((1-p)*Math.PI)*0.3); }
                                                                
                                                                if (localTime < dIn && trans.in === 'fade') currentAlpha = (clipTrack.properties?.opacity !== undefined ? clipTrack.properties.opacity / 100 : 1) * (localTime / dIn);
                                                                else if (localTime > totalD - dOut && trans.out === 'fade') currentAlpha = (clipTrack.properties?.opacity !== undefined ? clipTrack.properties.opacity / 100 : 1) * ((totalD - localTime) / dOut);
                                                            }

                                                            let details = [];
                                                            details.push(`Scale: ${Math.round(dynScale * 100)}%`);
                                                            if (posX || posY) details.push(`Pos: ${posX.toFixed(0)},${posY.toFixed(0)}`);
                                                            if (rot) details.push(`Rot: ${rot}°`);
                                                            if (currentAlpha < 1) details.push(`Opacity: ${Math.round(currentAlpha * 100)}%`);
                                                            
                                                            activeLayerNames.push(layerLogName + (clipTrack.aiSegmentation?.enabled ? ' [AI Removal]' : '') + ` {${details.join(', ')}}`);
                                                            
                                                            if (clipTrack.type === 'video' || clipTrack.type === 'main' || clipTrack.type === 'speaker') {
                                                                ctx.save();
                                                                // تطبيق Transform للفيديوهات فقط
                                                                const centerX = width / 2; const centerY = height / 2;
                                                                const posX = (clipTrack.properties?.positionX || 0) * ratioX;
                                                                const posY = (clipTrack.properties?.positionY || 0) * ratioY;
                                                                const rot = clipTrack.properties?.rotation || 0;
                                                                // DO NOT apply scaleRatio here because ctx.drawImage uses width/height which are already scaled
                                                                const scale = (clipTrack.properties?.scale !== undefined ? clipTrack.properties.scale / 100 : 1);
                                                                const scaleX = (clipTrack.properties?.scaleX !== undefined ? clipTrack.properties.scaleX / 100 : 1);
                                                                const scaleY = (clipTrack.properties?.scaleY !== undefined ? clipTrack.properties.scaleY / 100 : 1);
                                                                let currentAlpha = clipTrack.properties?.opacity !== undefined ? clipTrack.properties.opacity / 100 : 1;

                                                                ctx.translate(centerX + posX, centerY + posY);
                                                                ctx.rotate((rot * Math.PI) / 180);
                                                                ctx.scale(scale * scaleX, scale * scaleY);
                                                                ctx.globalAlpha = currentAlpha;

                                                                if (clipTrack.aiSegmentation?.enabled && mask) {
                                                                    tempCtx.globalCompositeOperation = 'source-over';
                                                                    tempCtx.clearRect(0, 0, width, height);
                                                                    tempCtx.drawImage(frame, 0, 0, width, height);
                                                                    const frameImgData = tempCtx.getImageData(0, 0, width, height);
                                                                    
                                                                    const rawMaskCanvas = document.createElement('canvas');
                                                                    rawMaskCanvas.width = width; rawMaskCanvas.height = height;
                                                                    rawMaskCanvas.getContext('2d').drawImage(mask, 0, 0, width, height);
                                                                    
                                                                    const maskCanvas = document.createElement('canvas');
                                                                    maskCanvas.width = width; maskCanvas.height = height;
                                                                    const maskCtx = maskCanvas.getContext('2d');
                                                                    maskCtx.drawImage(rawMaskCanvas, 0, 0, width, height);
                                                                    const mData = maskCtx.getImageData(0, 0, width, height).data;
                                                                    
                                                                    const fData = frameImgData.data;
                                                                    const tightness = parseInt(document.getElementById('aiTightness').value);
                                                                    for (let j = 0; j < fData.length; j += 4) {
                                                                        if (mData[j+3] > tightness) fData[j+3] = 255;
                                                                        else { fData[j] = 0; fData[j+1] = 0; fData[j+2] = 0; fData[j+3] = 0; }
                                                                    }
                                                                    tempCtx.putImageData(frameImgData, 0, 0);
                                                                    ctx.drawImage(tempCanvas, -width/2, -height/2, width, height);
                                                                } else {
                                                                    ctx.drawImage(frame, -width/2, -height/2, width, height);
                                                                }
                                                                ctx.restore();
                                                            } else if (clipTrack.type === 'text') {
                                                                window.drawAdvancedText(ctx, clipTrack, width, height, timeInSeconds, ratioX, ratioY, scaleRatio);
                                                            } else if (clipTrack.type === 'image' && window.imageCache[clipTrack.src]) {
                                                                window.drawImageClip(ctx, clipTrack, width, height, timeInSeconds, ratioX, ratioY, scaleRatio, frame);
                                                            }
                                                        }
                                                    }
                                                }
                                            }

                                            const newFrame = new VideoFrame(canvas, { timestamp: timelineTimeUs });
                                            videoEncoder.encode(newFrame, { keyFrame: isKeyFrame });
                                            newFrame.close();
                                            frame.close();
                                            
                                            frameCount++;
                                            if (frameCount % 60 === 0) log(`⏳ إطار ${frameCount} (التوقيت ${timeInSeconds.toFixed(1)}s): تم دمج [${activeLayerNames.join(' + ')}]`);
                                            
                                            processingAI = false;
                                            processQueue();
                                        };
                                            if (needsAI) {
                                                window.currentMaskResolve = renderAllLayers;
                                                if (!tmpCanvas || tmpCanvas.width !== frame.displayWidth || tmpCanvas.height !== frame.displayHeight) {
                                                    tmpCanvas = new OffscreenCanvas(frame.displayWidth, frame.displayHeight);
                                                    tmpCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });
                                                }
                                                tmpCtx.drawImage(frame, 0, 0, frame.displayWidth, frame.displayHeight);
                                                await window.segmentationModel.send({ image: tmpCanvas });
                                            } else {
                                                renderAllLayers(null);
                                            }
                                        };

                                    decoder = new VideoDecoder({
                                        output: (frame) => {
                                            const frameTimeUs = frame.timestamp;
                                            const sourceInUs = (clip.sourceIn || 0) * 1_000_000;
                                            const sourceEndUs = sourceInUs + ((clip.duration || 999999) * 1_000_000);
                                            
                                            // 1. هل الفريم جوه الجزء المقصوص؟
                                            if (frameTimeUs >= sourceInUs && frameTimeUs <= sourceEndUs) {
                                                // 2. تعيين التوقيت الجديد على حسب التايم لاين!
                                                const timelineTimeUs = (clip.start * 1_000_000) + (frameTimeUs - sourceInUs);
                                                
                                                // التأكد من عدم وجود تداخل زمني (Overlaps) عشان الـ Encoder ميكراش
                                                if (window.lastEncodedTimeUs && timelineTimeUs <= window.lastEncodedTimeUs) {
                                                    frame.close();
                                                    return;
                                                }
                                                window.lastEncodedTimeUs = timelineTimeUs;

                                                frameQueue.push({ frame, isKeyFrame: frameCount % 60 === 0, timelineTimeUs });
                                                processQueue();
                                            } else {
                                                frame.close(); // تجاهل الفريم المقصوص
                                            }
                                        },
                                        error: e => {
                                            log("❌ خطأ Decoder: " + e.message);
                                            reject(e);
                                        }
                                    });

                                    log(`🚀 تشغيل VideoDecoder بنوع: ${track.codec}`);
                                    decoder.configure({
                                        codec: track.codec,
                                        codedWidth: track.video.width,
                                        codedHeight: track.video.height,
                                        description: description,
                                        hardwareAcceleration: "prefer-hardware"
                                    });

                                    mp4boxfile.setExtractionOptions(track.id);
                                    mp4boxfile.start();
                                } catch (err) {
                                    log("❌ خطأ داخل onReady: " + err.message);
                                    reject(err);
                                }
                            };

                            let extractionComplete = false;
                            mp4boxfile.onSamples = (id, user, samples) => {
                                try {
                                    for (const sample of samples) {
                                        decoder.decode(new EncodedVideoChunk({
                                            type: sample.is_sync ? "key" : "delta",
                                            timestamp: (sample.cts * 1_000_000) / sample.timescale,
                                            duration: (sample.duration * 1_000_000) / sample.timescale,
                                            data: sample.data
                                        }));
                                    }
                                } catch (err) {
                                    log("❌ خطأ داخل onSamples: " + err.message);
                                    reject(err);
                                }
                            };

                            log("▶️ بدء إدخال الداتا...");
                            mp4boxfile.appendBuffer(buffer);
                            mp4boxfile.flush();
                            
                            log("⏳ انتظار تفريغ الـ Decoder...");
                            if (decoder) {
                                await decoder.flush();
                                // Wait for frame queue to fully process
                                while (!window.isQueueEmpty) {
                                    await new Promise(r => setTimeout(r, 50));
                                }
                                resolve();
                            } else {
                                throw new Error("لم يتم تهيئة الـ Decoder، ربما الملف غير مدعوم.");
                            }

                        } catch (err) {
                            log("❌ خطأ عام: " + err.message);
                            reject(err);
                        }
                    });
                }

                // تجهيز الذكاء الاصطناعي لو ما تمش تحميله في المعاينة
                await initAIModelIfNeeded();

                for (const clip of videoClips) {
                    await processVideo("file", clip);
                }

                // processVideo already waits for the queue to empty internally.

                // توليد الفريمات المتبقية للصور والنصوص لو التايم لاين مدته أطول من الفيديو
                const targetDurationUs = (window.exportManifest.duration || 0) * 1_000_000;
                let currentTimeUs = window.lastEncodedTimeUs ? window.lastEncodedTimeUs + (1_000_000 / fps) : 0;
                
                if (currentTimeUs < targetDurationUs) {
                    log(`⏳ استكمال الفريمات المتبقية (صور ونصوص فقط)...`);
                    const syntheticFrames = Math.ceil((targetDurationUs - currentTimeUs) / (1_000_000 / fps));
                    for (let i = 0; i < syntheticFrames; i++) {
                        const timeInSeconds = currentTimeUs / 1_000_000;
                        
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.clearRect(0, 0, width, height);
                        
                        const baseW = window.exportManifest?.baseWidth || 1280;
                        const baseH = window.exportManifest?.baseHeight || 720;
                        const ratioX = width / baseW;
                        const ratioY = height / baseH;
                        const scaleRatio = Math.min(ratioX, ratioY);
                        
                        let activeLayerNamesSynth = [];
                        if (window.exportManifest && window.exportManifest.tracks) {
                            for (let j = window.exportManifest.tracks.length - 1; j >= 0; j--) {
                                const track = window.exportManifest.tracks[j];
                                for (const clipTrack of track.clips) {
                                    if (timeInSeconds >= clipTrack.start && timeInSeconds < clipTrack.start + clipTrack.duration) {
                                        const layerLogName = track.trackName ? `[${track.trackName}] (${clipTrack.type.toUpperCase()})` : clipTrack.type.toUpperCase();
                                        
                                        const posX = (clipTrack.properties?.positionX || 0) * ratioX;
                                        const posY = (clipTrack.properties?.positionY || 0) * ratioY;
                                        const rot = clipTrack.properties?.rotation || 0;
                                        // DO NOT apply scaleRatio here
                                        const scale = (clipTrack.properties?.scale !== undefined ? clipTrack.properties.scale / 100 : 1);
                                        const scaleX = (clipTrack.properties?.scaleX !== undefined ? clipTrack.properties.scaleX / 100 : 1);
                                        const scaleY = (clipTrack.properties?.scaleY !== undefined ? clipTrack.properties.scaleY / 100 : 1);
                                        let currentAlpha = clipTrack.properties?.opacity !== undefined ? clipTrack.properties.opacity / 100 : 1;

                                        let dynScale = scale * scaleX;
                                        if (clipTrack.transitions) {
                                            const trans = clipTrack.transitions;
                                            const localTime = timeInSeconds - clipTrack.start;
                                            const totalD = clipTrack.duration;
                                            const dIn = trans.duration || 0.5;
                                            const dOut = trans.duration || 0.5;
                                            if (localTime < dIn && trans.in === 'pop') dynScale = scale * Math.max(0.01, (localTime/dIn) + Math.sin((localTime/dIn)*Math.PI)*0.3);
                                            else if (localTime > totalD - dOut && trans.out === 'pop') { const p = (totalD-localTime)/dOut; dynScale = scale * Math.max(0.01, p + Math.sin((1-p)*Math.PI)*0.3); }
                                            
                                            if (localTime < dIn && trans.in === 'fade') currentAlpha = (clipTrack.properties?.opacity !== undefined ? clipTrack.properties.opacity / 100 : 1) * (localTime / dIn);
                                            else if (localTime > totalD - dOut && trans.out === 'fade') currentAlpha = (clipTrack.properties?.opacity !== undefined ? clipTrack.properties.opacity / 100 : 1) * ((totalD - localTime) / dOut);
                                        }

                                        let details = [];
                                        details.push(`Scale: ${Math.round(dynScale * 100)}%`);
                                        if (posX || posY) details.push(`Pos: ${posX.toFixed(0)},${posY.toFixed(0)}`);
                                        if (rot) details.push(`Rot: ${rot}°`);
                                        if (currentAlpha < 1) details.push(`Opacity: ${Math.round(currentAlpha * 100)}%`);

                                        activeLayerNamesSynth.push(layerLogName + (clipTrack.aiSegmentation?.enabled ? ' [AI Removal]' : '') + ` {${details.join(', ')}}`);
                                        ctx.save();
                                        if (clipTrack.type === 'text') {
                                            window.drawAdvancedText(ctx, clipTrack, width, height, timeInSeconds, ratioX, ratioY, scaleRatio);
                                        } else if (clipTrack.type === 'image' && window.imageCache[clipTrack.src]) {
                                            window.drawImageClip(ctx, clipTrack, width, height, timeInSeconds, ratioX, ratioY, scaleRatio);
                                        }
                                        ctx.restore();
                                    }
                                }
                            }
                        }
                        
                        const newFrame = new VideoFrame(canvas, { timestamp: currentTimeUs });
                        videoEncoder.encode(newFrame, { keyFrame: frameCount % 60 === 0 });
                        newFrame.close();
                        
                        currentTimeUs += (1_000_000 / fps);
                        frameCount++;
                        if (frameCount % 60 === 0) {
                            log(`⏳ إطار ${frameCount} (استكمال عند ${timeInSeconds.toFixed(1)}s): تم رسم [${activeLayerNamesSynth.join(' + ')}]`);

                            await new Promise(r => setTimeout(r, 0));
                        }
                    }
                }

                const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
                const audioCache = {};

                async function processAudioClip(clip) {
                    log(`🔊 معالجة مقطع صوت من التايم لاين...`);
                    let audioBuffer;
                    
                    // تحديد المصدر (فيديو أساسي أو مؤثر صوتي خارجي)
                    const isMainFile = clip.src === 'file' || !clip.src || clip.src.includes('p43_video');
                    const cacheKey = isMainFile ? 'main' : clip.src;

                    if (audioCache[cacheKey]) {
                        audioBuffer = audioCache[cacheKey];
                    } else {
                        let buffer;
                        if (isMainFile && window.videoFile) {
                            buffer = await window.videoFile.arrayBuffer();
                        } else {
                            const response = await fetch(isMainFile ? '/1.mp4' : clip.src);
                            buffer = await response.arrayBuffer();
                        }
                        audioBuffer = await audioContext.decodeAudioData(buffer);
                        audioCache[cacheKey] = audioBuffer;
                    }

                    const sourceInSeconds = clip.sourceIn || 0;
                    const durationSeconds = clip.duration || audioBuffer.duration;
                    
                    const startSample = Math.floor(sourceInSeconds * sampleRate);
                    const endSample = Math.floor((sourceInSeconds + durationSeconds) * sampleRate);
                    const totalSamples = Math.min(endSample - startSample, audioBuffer.length - startSample);
                    
                    if (totalSamples <= 0) return;

                    const chunkSize = 4096;
                    for (let offset = 0; offset < totalSamples; offset += chunkSize) {
                        const frameCount = Math.min(chunkSize, totalSamples - offset);
                        const data = new Float32Array(frameCount * audioChannels);
                        
                        for (let c = 0; c < audioChannels; c++) {
                            const srcChannel = c < audioBuffer.numberOfChannels ? c : 0;
                            const channelData = audioBuffer.getChannelData(srcChannel).subarray(
                                startSample + offset, 
                                startSample + offset + frameCount
                            );
                            data.set(channelData, c * frameCount);
                        }
                        
                        const timestampUs = (clip.start * 1_000_000) + Math.round((offset / sampleRate) * 1_000_000);
                        
                        // منع التداخل الزمني عشان الـ Muxer ميكراش
                        if (window.lastAudioEncodedTimeUs && timestampUs <= window.lastAudioEncodedTimeUs) {
                            continue;
                        }
                        window.lastAudioEncodedTimeUs = timestampUs;

                        const audioData = new AudioData({
                            format: 'f32-planar', sampleRate, numberOfFrames: frameCount, numberOfChannels: audioChannels,
                            timestamp: timestampUs, data
                        });
                        audioEncoder.encode(audioData);
                        audioData.close();
                    }
                }

                log("🖼️ جاري تحميل صورة الخلفية (الطبقة الثانية)...");
                window.bgImgLoaded = new Image();
                window.bgImgLoaded.src = '/bg.png';
                await new Promise(r => { window.bgImgLoaded.onload = r; window.bgImgLoaded.onerror = r; });

                for (const clip of audioClips) {
                    await processAudioClip(clip);
                }

                // انتظار تفريغ الـ AI Queue
                log("⏳ انتظار تفريغ الـ AI والـ Encoder...");
                while (true) {
                    if (window.isQueueEmpty) break; 
                    await new Promise(r => setTimeout(r, 100));
                }

                await videoEncoder.flush(); await audioEncoder.flush();
                muxer.finalize();
                const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
                const finalUrl = URL.createObjectURL(blob);
                
                log("✅ اكتمل الدمج المحلي!");
                const resultVideo = document.getElementById('resultVideo');
                resultVideo.src = finalUrl;
                resultVideo.style.display = 'block';

                const a = document.createElement('a');
                a.href = finalUrl;
                a.download = `3_${height}p.mp4`;
                a.click();
                
            } catch (err) { log("❌ خطأ: " + err.message); }
            document.getElementById('startBtn').disabled = false;
            document.getElementById('cloudBtn').disabled = false;
        });

        // =====================================================================
        // الكود الثاني: الرندرة السحابية (Cloud Functions 8GB)
        // =====================================================================
        document.getElementById('cloudBtn').addEventListener('click', async () => {
            document.getElementById('startBtn').disabled = true;
            document.getElementById('cloudBtn').disabled = true;
            log("☁️ جاري تجهيز الطلب السحابي...");

            try {
                const { width, height } = getQualitySettings();
                log(`⚙️ جودة الرندرة: ${width}x${height}`);

                // 1. رفع الفيديوهات للـ Storage عشان السيرفر يقدر يشوفهم
                async function uploadLocalVideo(path, name) {
                    log(`⬆️ جاري رفع ${name} للسيرفر...`);
                    const res = await fetch(path);
                    const blob = await res.blob();
                    const fileRef = ref(storage, `test_assets/${name}`);
                    await uploadBytes(fileRef, blob);
                    return await getDownloadURL(fileRef);
                }

                const url1 = await uploadLocalVideo('/1.mp4', `1_${Date.now()}.mp4`);
                const url2 = await uploadLocalVideo('/2.mp4', `2_${Date.now()}.mp4`);
                log(`✅ تم الرفع بنجاح! تجهيز Timeline...`);

                // 2. تجهيز التايم لاين بالجودة المحددة
                const timeline = {
                    projectId: "test_cloud",
                    resolution: { width, height },
                    fps: 30,
                    duration: 16, 
                    tracks: [
                        {
                            id: "track_0",
                            clips: [
                                { id: "c1", type: "video", src: url1, localPath: url1, start: 0, duration: 8, properties: { width, height, x: 0, y: 0 } },
                                { id: "c2", type: "video", src: url2, localPath: url2, start: 8, duration: 8, properties: { width, height, x: 0, y: 0 } }
                            ]
                        }
                    ]
                };

                // 3. إرسال الطلب
                log("📡 إرسال الطلب للسيرفر (8GB RAM)...");
                const docRef = await addDoc(collection(db, "renders"), {
                    status: "QUEUED",
                    timeline: timeline,
                    createdAt: serverTimestamp()
                });

                log(`⏱️ السيرفر بدأ المعالجة (Job: ${docRef.id})... بنراقب الحالة.`);
                const startTime = Date.now();

                // 4. مراقبة النتيجة
                const unsubscribe = onSnapshot(docRef, (doc) => {
                    const data = doc.data();
                    if (!data) return;
                    
                    if (data.status === "PROCESSING") {
                        log(`⚙️ السيرفر شغال دلوقتي...`);
                    } else if (data.status === "COMPLETED") {
                        const timeTaken = ((Date.now() - startTime) / 1000).toFixed(1);
                        log(`✅ اكتملت الرندرة السحابية في ${timeTaken} ثانية!`);
                        
                        const resultVideo = document.getElementById('resultVideo');
                        resultVideo.src = data.downloadUrl;
                        resultVideo.style.display = 'block';
                        
                        unsubscribe();
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('cloudBtn').disabled = false;
                    } else if (data.status === "FAILED") {
                        log(`❌ فشل السيرفر: ${data.error}`);
                        unsubscribe();
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('cloudBtn').disabled = false;
                    }
                });

            } catch (err) {
                log("❌ خطأ: " + err.message);
                document.getElementById('startBtn').disabled = false;
                document.getElementById('cloudBtn').disabled = false;
            }
        });
        // محاولة تحميل الملفات من IndexedDB عند فتح الصفحة
        async function loadFromDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open('p43_file_store', 1);
                req.onsuccess = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) { resolve(); return; }
                    const tx = db.transaction('files', 'readonly');
                    const store = tx.objectStore('files');
                    
                    const reqVid = store.get('p43_video');
                    reqVid.onsuccess = (ev) => {
                        if (ev.target.result) {
                            window.videoFile = ev.target.result;
                            document.getElementById('hiddenPreviewVideo').src = URL.createObjectURL(window.videoFile);
                            log('📥 تم تحميل فيديو المشروع من الذاكرة بنجاح.');
                        } else {
                            document.getElementById('hiddenPreviewVideo').src = '/1.mp4';
                        }
                    };

                    const reqBg = store.get('p43_bg_image');
                    reqBg.onsuccess = (ev) => {
                        if (ev.target.result) {
                            window.bgFile = ev.target.result;
                            log('📥 تم تحميل صورة الخلفية من الذاكرة بنجاح.');
                        }
                    };

                    const reqManifest = store.get('p43_export_manifest');
                    reqManifest.onsuccess = async (ev) => {
                        if (ev.target.result) {
                            const text = await ev.target.result.text();
                            window.exportManifest = JSON.parse(text);
                            log('📥 تم تحميل خريطة التايم لاين (Manifest) بنجاح.');
                            
                            // طباعة اللقطة (Snapshot) للتأكيد وتعيين أسماء التراكات
                            if (window.exportManifest.tracks) {
                                const getTrackName = (type, index) => {
                                    if (['video', 'main', 'overlay'].includes(type)) return `V${index}`;
                                    if (['audio'].includes(type)) return `A${index}`;
                                    if (['text', 'subtitle'].includes(type)) return `T${index}`;
                                    return `X${index}`;
                                };
                                let trackCounters = { video: 1, audio: 1, text: 1 };
                                const reversedTracks = [...window.exportManifest.tracks].reverse();
                                
                                const snapshot = reversedTracks.map(t => {
                                    let typeGroup = 'video';
                                    if (['audio'].includes(t.type)) typeGroup = 'audio';
                                    if (['text', 'subtitle'].includes(t.type)) typeGroup = 'text';
                                    const tName = getTrackName(t.type, trackCounters[typeGroup]++);
                                    
                                    // تخزين اسم التراك الحقيقي عشان نستخدمه في الرندرة
                                    t.trackName = tName;
                                    
                                    let trackTransStr = "";
                                    if (t.transitions && t.transitions.length > 0) {
                                        trackTransStr = "\n  [Track Transitions: " + t.transitions.map(tr => `${tr.type} @ ${tr.cutTime.toFixed(3)}s (Dur: ${((tr.inOffset || 0.5) + (tr.outOffset || 0.5)).toFixed(3)}s)`).join(", ") + "]";
                                    }
                                    return `[${tName}] (${t.type.toUpperCase()}):${trackTransStr}\n` + 
                                        t.clips.map((c, cIdx) => {
                                            const ai = c.aiSegmentation?.enabled ? "Yes" : "No";
                                            let transStr = "none(1.0s) -> none(1.0s)";
                                            if (c.transitions) {
                                                const dur = (c.transitions.duration || 1.0).toFixed(1);
                                                transStr = `${c.transitions.in || 'none'}(${dur}s) -> ${c.transitions.out || 'none'}(${dur}s)`;
                                            }
                                            return `  - ${cIdx+1}${tName.toLowerCase()} (${c.start.toFixed(3)}s -> ${(c.start + c.duration).toFixed(3)}s) | AI Removal: ${ai} | Transitions: ${transStr}\n    Props: ${JSON.stringify(c.properties || {})}`;
                                        }).join('\n');
                                }).reverse().join('\n\n');
                                
                                log(`📸 لقطة التايم لاين الحالية (بواسطة محرك التصدير):\n${snapshot}`);
                            }
                        }
                    };

                    tx.oncomplete = resolve;
                };
                req.onerror = () => {
                    document.getElementById('hiddenPreviewVideo').src = '/1.mp4';
                    resolve();
                };
            });
        }
        
        window.addEventListener('DOMContentLoaded', async () => {
            log('جاري فحص الذاكرة المحلية للمشروع...');
            await loadFromDB();
        });
    </script>
</body>
